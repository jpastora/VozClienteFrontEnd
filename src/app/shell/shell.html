<aside class="vc-shell__sidebar">
  <a class="vc-shell__brand" [routerLink]="rutas.home" aria-label="Voz Cliente, ir al inicio">
    <vc-logo tono="oscuro" />
  </a>
  <nav aria-label="Principal">
    @for (opcion of opciones(); track opcion.ruta) {
      <a [routerLink]="opcion.ruta" routerLinkActive="is-active">{{ opcion.texto }}</a>
    }
  </nav>

  @if (usuario(); as u) {
    <div class="vc-shell__usuario">
      <p class="vc-shell__nombre">{{ u.nombreCompleto }}</p>
      <p class="vc-shell__rol">{{ nombreRol() }}</p>
      <button id="btnCerrarSesion" type="button" class="vc-shell__salir" (click)="salir()">Cerrar sesión</button>
    </div>
  }
</aside>
<div class="vc-shell__content">
  <main class="vc-shell__main"><router-outlet /></main>
</div>
